<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F0E6FF"/>
    </linearGradient>
    <pattern id="chat" width="160" height="160" patternUnits="userSpaceOnUse">
      <g opacity="0.12">
        <rect x="20" y="20" width="50" height="30" rx="10" fill="#8B7CF0"/>
        <rect x="90" y="90" width="50" height="30" rx="10" fill="#FF9A8A"/>
      </g>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#chat)"/>
</svg>
